[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contexa-relay"
version = "0.1.0"
description = "Contexa relay server — stateless WebSocket message router for device-to-device sync"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "cryptography>=42.0.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
